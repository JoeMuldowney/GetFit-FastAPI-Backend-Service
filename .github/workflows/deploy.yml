name: Getfit CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DBUSER: testuser
      DBPASS: testpassword
      DBHOST: 127.0.0.1
      DBNAME: testdb
      DBPORT: 5432
      SECRETKEY: itsasecret
      ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Test
        run: poetry run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            if [ ! -d /var/www/forgevitahq/backend/.git ]; then
              git clone git@github.com:JoeMuldowney/GetFit-FastAPI-Backend-Service.git /var/www/forgevitahq/backend
            else
              cd /var/www/forgevitahq/backend
              git pull origin main
            fi
          
            cd /var/www/forgevitahq/backend
            docker compose -f docker-compose.prod.yml up -d --build